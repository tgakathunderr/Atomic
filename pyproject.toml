[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-lm"
version = "0.1.0"
description = "Adaptive Token Operator for Memory-efficient Inference on Consumer CPUs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "UnikAI Lab", email = "contact@unikai.in" }
]
keywords = [
    "deep-learning",
    "language-model",
    "linear-attention",
    "cpu-inference",
    "recurrent-neural-networks",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]
export = [
    "onnx>=1.16.0",
    "onnxscript>=0.7.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build",
    "twine",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "onnx>=1.16.0",
    "onnxscript>=0.7.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://www.unikai.in"
Repository = "https://github.com/tgakathunderr/Atomic"
Documentation = "https://github.com/tgakathunderr/Atomic#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["atomic*"]
exclude = ["tests*", "benchmarks*", "demo*", "data*", "models*"]

[tool.setuptools.package-data]
atomic = ["py.typed"]
